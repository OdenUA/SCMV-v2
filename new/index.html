<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCMV v2</title>
  <script>
    try {
      const theme = localStorage.getItem('scmv_theme') === 'light' ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      document.documentElement.classList.toggle('dark', theme === 'dark');
      document.documentElement.style.colorScheme = theme;
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <script>
    // Защита: без активной сессии — на страницу входа
    try {
      if (localStorage.getItem('dt_session') !== '1') location.replace('login.html');
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="vendor/tailwind/app.css" />
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/leaflet-polylinedecorator/leaflet.polylineDecorator.js"></script>
  <script src="vendor/chart.js/chart.umd.min.js"></script>
  <script src="vendor/xlsx/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="bg-darkbg-900 text-gray-200 font-sans h-screen flex flex-col overflow-hidden">

  <!-- Шапка -->
  <header class="h-14 bg-darkbg-800 border-b border-gray-800 px-4 flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center space-x-3 min-w-0">
      <div class="bg-brand-600 text-white p-2 rounded-lg flex items-center justify-center shadow-lg shadow-brand-500/20 shrink-0">
        <i class="fa-solid fa-route text-lg"></i>
      </div>
      <div class="min-w-0">
        <h1 class="font-bold text-base tracking-wide text-white leading-tight">SCMV v2</h1>
        <p class="text-xs text-gray-400 truncate">Система мониторинга корпоративного автопарка</p>
      </div>
      <div id="headerVehicle" class="hidden lg:block text-xs text-gray-400 truncate ml-4 max-w-[280px]"></div>
    </div>

    <div class="flex items-center space-x-4 text-xs">
      <div class="hidden md:flex items-center space-x-2" title="Статус соединения">
        <span id="loadIndicator" class="hidden items-center space-x-1.5 text-brand-400 font-medium" title="Идёт загрузка данных с сервера">
          <span class="load-spinner"></span>
          <span id="loadIndicatorText">Загрузка данных…</span>
        </span>
        <span id="wsStatusDot" class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
        <span id="statusText" class="status-text">Не подключено</span>
        <span id="lastResponse" class="text-gray-500"></span>
      </div>
      <button type="button" data-theme-toggle class="p-2 text-gray-400 hover:text-white bg-darkbg-700 hover:bg-gray-700 rounded-lg transition" title="Светлая тема" aria-label="Светлая тема" aria-pressed="false">
        <i class="fa-solid fa-circle-half-stroke"></i>
      </button>
      <a href="admin.html" id="adminLink" title="Админ-панель"
        class="p-2 text-gray-400 hover:text-white bg-darkbg-700 hover:bg-gray-700 rounded-lg transition">
        <i class="fa-solid fa-screwdriver-wrench"></i>
      </a>
      <div class="flex items-center space-x-2 border-l border-gray-700 pl-3">
        <div class="w-8 h-8 rounded-full bg-brand-700 text-white flex items-center justify-center font-bold text-sm" id="userAvatar">?</div>
        <div class="hidden sm:block text-left">
          <div class="text-xs font-semibold text-gray-200" id="userName">—</div>
          <div class="text-[10px] text-gray-400">SCMV</div>
        </div>
      </div>
      <button id="logoutBtn" title="Выйти" class="p-2 text-gray-400 hover:text-rose-400 bg-darkbg-700 hover:bg-gray-700 rounded-lg transition">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <!-- Дашборд (шаблон + модули) -->
  <div id="dashboardMount" class="flex-1 flex overflow-hidden relative"></div>

  <script type="module" src="js/app/main.js"></script>
</body>
</html>
