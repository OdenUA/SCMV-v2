<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCMV v2 — Вход</title>
  <link rel="stylesheet" href="vendor/tailwind/app.css" />
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    // Уже вошли — сразу в дашборд
    try {
      if (localStorage.getItem('dt_session') === '1') location.replace('index.html');
    } catch (e) {}
  </script>
</head>
<body class="bg-darkbg-900 text-gray-200 font-sans min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <div class="inline-flex bg-brand-600 text-white p-3 rounded-2xl shadow-lg shadow-brand-500/20 mb-3">
        <i class="fa-solid fa-route text-2xl"></i>
      </div>
      <h1 class="text-xl font-bold text-white tracking-wide">SCMV v2</h1>
      <p class="text-sm text-gray-400">Система мониторинга корпоративного автопарка</p>
    </div>

    <form id="loginForm" class="glass-panel rounded-2xl p-6 space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5" for="loginUser">
          <i class="fa-solid fa-user mr-1 text-brand-500"></i> Логин
        </label>
        <input type="text" id="loginUser" autocomplete="username" required
          class="w-full bg-darkbg-900 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-brand-500 transition" />
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5" for="loginPwd">
          <i class="fa-solid fa-lock mr-1 text-brand-500"></i> Пароль
        </label>
        <input type="password" id="loginPwd" autocomplete="current-password" required
          class="w-full bg-darkbg-900 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-brand-500 transition" />
      </div>
      <label class="flex items-center space-x-2 text-sm text-gray-300 cursor-pointer select-none">
        <input type="checkbox" id="loginRemember" checked
          class="rounded border-gray-700 text-brand-600 focus:ring-0 bg-darkbg-900 w-4 h-4" />
        <span>Запомнить меня</span>
      </label>
      <button type="submit" id="loginSubmitBtn"
        class="w-full bg-brand-600 hover:bg-brand-500 text-white font-medium py-2.5 rounded-lg transition shadow-lg shadow-brand-600/30 flex items-center justify-center space-x-2 text-sm">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>Войти</span>
      </button>
      <div id="loginStatus" class="text-xs text-center text-gray-400 min-h-[1rem]"></div>
      <div id="loginWsUrl" class="text-[10px] text-center text-gray-600"></div>
    </form>
  </div>

  <script type="module">
    import { connect, close, sendRaw, buildLoginRequest, onWsEvent } from './js/core/ws.js';
    import { auth, initAuth, persistCredentials } from './js/core/auth.js';
    import { getWsUrl } from './js/core/config.js';

    initAuth();

    const form = document.getElementById('loginForm');
    const userInput = document.getElementById('loginUser');
    const pwdInput = document.getElementById('loginPwd');
    const rememberInput = document.getElementById('loginRemember');
    const statusEl = document.getElementById('loginStatus');
    const submitBtn = document.getElementById('loginSubmitBtn');
    const wsUrlEl = document.getElementById('loginWsUrl');

    if (localStorage.getItem('scmv_ws_url')) {
      wsUrlEl.textContent = 'WS: ' + getWsUrl();
    }

    // Подставляем сохранённый логин (пароль не подставляем из соображений безопасности)
    try {
      const savedUser = localStorage.getItem('dt_user');
      if (savedUser) userInput.value = savedUser;
      const remembered = localStorage.getItem('dt_remember') === '1';
      rememberInput.checked = remembered;
    } catch (e) {}

    function setStatus(text, color) {
      statusEl.textContent = text;
      statusEl.style.color = color || '';
    }

    let connecting = false;

    form.addEventListener('submit', (ev) => {
      ev.preventDefault();
      if (connecting) return;
      connecting = true;
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-60');

      const user = userInput.value.trim();
      const pwd = pwdInput.value;
      const remember = rememberInput.checked;

      // Временно сохраняем, чтобы ws.js поднял сессию при успехе
      persistCredentials(user, pwd, remember);
      setStatus('Подключение...', '#9ca3af');

      connect({ autoLogin: false });

      const offOpen = onWsEvent((event) => {
        if (event === 'open') {
          setStatus('Отправка логина...', '#3b82f6');
          sendRaw(buildLoginRequest(user, pwd));
        }
      });
      const offResult = onWsEvent((event) => {
        if (event === 'login-ok') {
          cleanup();
          setStatus('Успешно. Переход в дашборд...', '#10b981');
          setTimeout(() => { location.replace('index.html'); }, 300);
        } else if (event === 'login-failed') {
          cleanup();
          connecting = false;
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-60');
          setStatus('Ошибка логина. Проверьте логин/пароль.', '#ef4444');
          try {
            localStorage.removeItem('dt_session');
          } catch (e) {}
        } else if (event === 'close') {
          // не login-failed close: сеть недоступна
          if (auth.lastLoginFailed) return;
          cleanup();
          connecting = false;
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-60');
          setStatus('Соединение потеряно. Попробуйте ещё раз.', '#ef4444');
        }
      });

      function cleanup() {
        offOpen();
        offResult();
        close();
      }
    });
  </script>
</body>
</html>
